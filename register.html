<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลงทะเบียนใบหน้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> * { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-900">

<div class="fixed inset-0 z-[100] w-full h-full bg-slate-900 flex flex-col">
  <div class="w-full p-5 flex justify-between items-center bg-slate-900/80 backdrop-blur-md relative z-30">
    <div>
      <h2 class="text-white font-black text-lg">ลงทะเบียนใบหน้า</h2>
      <p id="reg-status-text" class="text-amber-400 text-xs font-bold animate-pulse">กำลังเตรียมระบบ...</p>
    </div>
    <button onclick="goBackToApp()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-rose-500 transition-colors">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="relative w-full h-full flex-1 flex items-center justify-center bg-black overflow-hidden">
    <video id="cam" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1] hidden"></video>
    <img id="reg-face-preview" class="w-full h-full object-contain transform scale-x-[-1] hidden" alt="Preview">
    <div id="cam-guide" class="absolute inset-0 hidden items-center justify-center pointer-events-none">
      <div class="w-56 h-56 border-2 border-indigo-400/70 rounded-full shadow-[0_0_40px_rgba(99,102,241,0.4)]"></div>
    </div>

    <div id="reg-camera-placeholder" class="text-center flex flex-col items-center justify-center px-6">
      <div class="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/10">
        <i data-lucide="scan-face" class="w-10 h-10 text-indigo-400"></i>
      </div>
      <p class="text-slate-400 text-sm font-medium mb-6">กดเริ่ม ระบบจะเปิดกล้องและจับใบหน้าให้อัตโนมัติ</p>
      <button onclick="startRegisterFlow()" id="btn-reg-start" disabled class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-full font-bold shadow-lg shadow-indigo-500/30 flex items-center gap-2 active:scale-95 transition-transform">
        <i data-lucide="camera" class="w-5 h-5"></i> <span id="btn-reg-label">กำลังเตรียม...</span>
      </button>
    </div>

    <div id="reg-scanning-badge" class="absolute bottom-28 left-1/2 -translate-x-1/2 hidden">
      <span class="text-xs font-bold text-white bg-indigo-600/90 px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังจับใบหน้า...
      </span>
    </div>

    <div id="device-block" class="absolute inset-0 bg-slate-900 flex-col items-center justify-center hidden px-8 z-50 text-center">
      <div class="w-24 h-24 bg-rose-500/20 rounded-full flex items-center justify-center mb-5 border border-rose-500/40">
        <i data-lucide="smartphone" class="w-12 h-12 text-rose-400"></i>
      </div>
      <h3 class="text-white font-black text-xl">กรุณาเปิดจากมือถือหรือ iPad</h3>
      <p class="text-slate-400 text-sm mt-2">ระบบลงทะเบียนใบหน้ารองรับเฉพาะโทรศัพท์มือถือหรือแท็บเล็ตเท่านั้น</p>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md p-6 rounded-t-3xl z-30 border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
    <div id="reg-action-area" class="hidden flex-col gap-3">
      <button onclick="saveFaceRegistration()" class="w-full py-3.5 bg-[#00B900] hover:bg-emerald-600 text-white rounded-xl text-sm font-bold flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform">
        <i data-lucide="save" class="w-5 h-5"></i> ยืนยันบันทึกใบหน้า
      </button>
      <button onclick="restartRegisterScan()" class="w-full py-3 bg-slate-800 border border-white/20 text-white rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-700 active:scale-95 transition-transform">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> สแกนใหม่อีกครั้ง
      </button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://lykcbppxbpnkipjhnqyk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2NicHB4YnBua2lwamhucXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwOTUwOTEsImV4cCI6MjA5MjY3MTA5MX0.bstoZYd8f0vC3FKnAr15S5AKuQtiT-wD019rc96e21k';

  let INAPP_IS_TESTING = false;
  let tempRegisterDescriptor = null;
  let camStream = null, scanning = false, detectBusy = false;

  function getHashParam(k) { return new URLSearchParams((location.hash || '').replace(/^#/, '')).get(k); }
  function isMobileOrTablet() {
    const ua = navigator.userAgent || '';
    const iPadOS13 = navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
    const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet|Silk|Kindle|PlayBook/i.test(ua);
    return mobileUA || iPadOS13;
  }
  function setStatus(txt, cls) { const el = document.getElementById('reg-status-text'); el.textContent = txt; el.className = (cls || 'text-amber-400') + ' text-xs font-bold'; }
  function goBackToApp() {
    stopCamera();
    try { window.close(); } catch (e) {}
    setTimeout(() => { document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Sarabun,sans-serif;text-align:center;padding:24px">เสร็จสิ้น — กลับไปที่แอป HR ได้เลยครับ<br>(ปิดแท็บนี้)</div>'; }, 300);
  }

  async function loadFaceScanConfig() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/system_configs?config_key=eq.face_scan_testing_mode&select=config_value`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      if (res.ok) { const d = await res.json(); if (d.length) INAPP_IS_TESTING = (String(d[0].config_value).trim().toLowerCase() === 'true'); }
    } catch (e) { console.warn(e); }
  }

  async function prepareRegister() {
    setStatus("กำลังโหลด AI Model...", 'text-blue-400');
    if (!window.faceapi.nets.ssdMobilenetv1.isLoaded) {
      const MODEL_URL = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
    }
    setStatus("พร้อมแล้ว — กดเริ่ม", 'text-emerald-400');
    document.getElementById('btn-reg-start').disabled = false;
    document.getElementById('btn-reg-label').textContent = 'เริ่ม';
  }

  function startRegisterFlow() { beginCamera(); }

  async function beginCamera() {
    try {
      tempRegisterDescriptor = null;
      document.getElementById('reg-action-area').classList.add('hidden');
      document.getElementById('reg-action-area').classList.remove('flex');
      document.getElementById('reg-face-preview').classList.add('hidden');
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
      const video = document.getElementById('cam');
      video.srcObject = camStream;
      await video.play();
      document.getElementById('reg-camera-placeholder').classList.add('hidden');
      video.classList.remove('hidden');
      document.getElementById('cam-guide').classList.remove('hidden');
      document.getElementById('cam-guide').classList.add('flex');
      document.getElementById('reg-scanning-badge').classList.remove('hidden');
      setStatus("กำลังจับใบหน้า — หันหน้าตรงเข้ากล้อง", 'text-indigo-400');
      scanning = true;
      detectLoop();
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'เปิดกล้องไม่ได้', text: 'กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ แล้วลองใหม่' }).then(goBackToApp);
    }
  }

  function stopCamera() {
    scanning = false;
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  }

  function videoToCanvas() {
    const video = document.getElementById('cam');
    if (!video.videoWidth) return null;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const MAX_WIDTH = 600;
    let s = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
    canvas.width = video.videoWidth * s;
    canvas.height = video.videoHeight * s;
    if (ctx.filter !== undefined) ctx.filter = 'brightness(1.12) contrast(1.08)';
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (ctx.filter !== undefined) ctx.filter = 'none';
    return canvas;
  }

  async function detectLoop() {
    if (!scanning) return;
    if (!detectBusy) {
      detectBusy = true;
      try {
        const canvas = videoToCanvas();
        if (canvas) {
          const det = await faceapi.detectSingleFace(canvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 })).withFaceLandmarks().withFaceDescriptor();
          if (det && det.detection.score >= 0.6) {
            // จับได้ชัด → เก็บ descriptor + หยุดกล้อง + ค้างภาพ
            tempRegisterDescriptor = det.descriptor;
            scanning = false;
            document.getElementById('reg-face-preview').src = canvas.toDataURL('image/jpeg', 0.9);
            document.getElementById('reg-face-preview').classList.remove('hidden');
            document.getElementById('cam').classList.add('hidden');
            document.getElementById('cam-guide').classList.add('hidden');
            document.getElementById('reg-scanning-badge').classList.add('hidden');
            stopCamera();
            setStatus("จับใบหน้าสำเร็จ! กดยืนยันเพื่อบันทึก", 'text-emerald-400');
            const aa = document.getElementById('reg-action-area');
            aa.classList.remove('hidden'); aa.classList.add('flex');
            detectBusy = false;
            return;
          }
        }
      } catch (e) { console.warn(e); }
      detectBusy = false;
    }
    setTimeout(detectLoop, 700);
  }

  function restartRegisterScan() { beginCamera(); }

  async function saveFaceRegistration() {
    if (!tempRegisterDescriptor) return;
    Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      const userId = getHashParam('uid');
      const token = getHashParam('token');
      const descriptorArray = Array.from(tempRegisterDescriptor);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token || SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ data_face_id: descriptorArray })
      });
      if (!res.ok) throw new Error(await res.text() || "ไม่สามารถอัปเดตฐานข้อมูลได้");
      Swal.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ', text: 'บันทึกข้อมูลใบหน้าเรียบร้อยแล้ว ตอนนี้สแกนหน้าเพื่อลงเวลาได้เลยครับ', confirmButtonColor: '#10b981' }).then(goBackToApp);
    } catch (e) {
      console.error(e);
      Swal.fire('ข้อผิดพลาด', e.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error');
    }
  }

  async function init() {
    if (window.lucide) lucide.createIcons();
    await loadFaceScanConfig();
    if (!INAPP_IS_TESTING && !isMobileOrTablet()) {
      document.getElementById('reg-camera-placeholder').classList.add('hidden');
      const b = document.getElementById('device-block'); b.classList.remove('hidden'); b.classList.add('flex');
      setStatus("อุปกรณ์ไม่รองรับ", 'text-rose-400');
      return;
    }
    if (!getHashParam('uid') || !getHashParam('token')) {
      Swal.fire({ icon: 'error', title: 'ลิงก์ไม่ถูกต้อง', text: 'ไม่พบข้อมูลยืนยันตัวตน กรุณาเปิดจากแอปอีกครั้ง' });
      return;
    }
    await prepareRegister();
  }
  window.addEventListener('load', init);
</script>
</body>
</html>

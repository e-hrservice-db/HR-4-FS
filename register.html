<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลงทะเบียนใบหน้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> * { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-900">

<div class="fixed inset-0 z-[100] w-full h-full bg-slate-900 flex flex-col">
  <div class="w-full p-5 flex justify-between items-center bg-slate-900/80 backdrop-blur-md relative z-30">
    <div>
      <h2 class="text-white font-black text-lg">ลงทะเบียนใบหน้า</h2>
      <p id="reg-status-text" class="text-amber-400 text-xs font-bold animate-pulse">กำลังเตรียมระบบ...</p>
    </div>
    <button onclick="goBackToApp()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-rose-500 transition-colors">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="relative w-full h-full flex-1 flex items-center justify-center bg-black overflow-hidden pb-16">
    <input type="file" id="reg-camera-input" accept="image/*" capture="user" class="hidden" onchange="processRegisterImage(event)">
    <img id="reg-face-preview" class="w-full h-full object-contain hidden transform scale-x-[-1]" alt="Preview">

    <div id="reg-camera-placeholder" class="text-center flex flex-col items-center justify-center px-6">
      <div class="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/10">
        <i data-lucide="scan-face" class="w-10 h-10 text-indigo-400"></i>
      </div>
      <p class="text-slate-400 text-sm font-medium mb-6">ระบบพร้อมแล้ว กดปุ่มด้านล่างเพื่อถ่ายรูปหน้าตรง</p>
      <button onclick="openRegisterCamera()" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full font-bold shadow-lg shadow-indigo-500/30 flex items-center gap-2 active:scale-95 transition-transform">
        <i data-lucide="camera" class="w-5 h-5"></i> เปิดกล้องถ่ายรูป
      </button>
    </div>

    <div id="reg-processing-overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center hidden z-20">
      <i data-lucide="loader-2" class="w-12 h-12 text-indigo-400 animate-spin mb-4"></i>
      <p class="text-white text-base font-bold tracking-wide">กำลังวิเคราะห์โครงหน้า...</p>
      <p class="text-indigo-400 text-xs mt-2 font-medium">AI กำลังประมวลผล กรุณารอสักครู่</p>
    </div>
  </div>

  <div class="absolute bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md p-6 rounded-t-3xl z-30 border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
    <div id="reg-action-area" class="hidden flex-col gap-3">
      <button onclick="saveFaceRegistration()" class="w-full py-3.5 bg-[#00B900] hover:bg-emerald-600 text-white rounded-xl text-sm font-bold flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform">
        <i data-lucide="save" class="w-5 h-5"></i> ยืนยันบันทึกใบหน้า
      </button>
      <button onclick="openRegisterCamera()" class="w-full py-3 bg-slate-800 border border-white/20 text-white rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-700 active:scale-95 transition-transform">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> ถ่ายรูปใหม่อีกครั้ง
      </button>
    </div>
    <div id="reg-hint-text" class="text-center text-xs text-slate-400 mt-2 hidden">หากรูปไม่ชัดเจน กรุณากดถ่ายรูปใหม่อีกครั้ง</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://lykcbppxbpnkipjhnqyk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2NicHB4YnBua2lwamhucXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwOTUwOTEsImV4cCI6MjA5MjY3MTA5MX0.bstoZYd8f0vC3FKnAr15S5AKuQtiT-wD019rc96e21k';

  let tempRegisterDescriptor = null;

  function getHashParam(k) {
    const h = (location.hash || '').replace(/^#/, '');
    return new URLSearchParams(h).get(k);
  }
  function goBackToApp() {
    try { window.close(); } catch (e) {}
    setTimeout(() => {
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Sarabun,sans-serif;text-align:center;padding:24px">เสร็จสิ้น — กลับไปที่แอป HR ได้เลยครับ<br>(ปิดแท็บนี้)</div>';
    }, 300);
  }

  async function initFaceRegistration() {
    const statusTxt = document.getElementById('reg-status-text');
    statusTxt.textContent = "กำลังโหลด AI Model...";
    statusTxt.className = "text-amber-400 text-xs font-bold animate-pulse";

    if (!getHashParam('uid') || !getHashParam('token')) {
      Swal.fire({ icon: 'error', title: 'ลิงก์ไม่ถูกต้อง', text: 'ไม่พบข้อมูลยืนยันตัวตน กรุณาเปิดจากแอปอีกครั้ง' });
      return;
    }
    try {
      if (!window.faceapi.nets.ssdMobilenetv1.isLoaded) {
        const MODEL_URL = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
      }
      statusTxt.textContent = "ระบบพร้อมแล้ว!";
      statusTxt.className = "text-emerald-400 text-xs font-bold";
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'การโหลด AI ล้มเหลว', text: 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' });
    }
  }

  function openRegisterCamera() { document.getElementById('reg-camera-input').click(); }

  async function processRegisterImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const imgPreview = document.getElementById('reg-face-preview');
    const placeholder = document.getElementById('reg-camera-placeholder');
    const overlay = document.getElementById('reg-processing-overlay');
    const actionArea = document.getElementById('reg-action-area');
    const hintText = document.getElementById('reg-hint-text');

    imgPreview.src = URL.createObjectURL(file);
    imgPreview.classList.remove('hidden');
    placeholder.classList.add('hidden');
    overlay.classList.remove('hidden');
    actionArea.classList.add('hidden'); actionArea.classList.remove('flex');
    hintText.classList.add('hidden');

    const st = document.getElementById('reg-status-text');
    st.textContent = "กำลังประมวลผลใบหน้า..."; st.className = "text-amber-400 text-xs font-bold animate-pulse";

    imgPreview.onload = async () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const MAX_WIDTH = 600;
        let scaleSize = 1;
        if (imgPreview.naturalWidth > MAX_WIDTH) scaleSize = MAX_WIDTH / imgPreview.naturalWidth;
        canvas.width = imgPreview.naturalWidth * scaleSize;
        canvas.height = imgPreview.naturalHeight * scaleSize;

        let filterApplied = false;
        if (ctx.filter !== undefined) { ctx.filter = 'brightness(1.15) contrast(1.10)'; filterApplied = true; }
        ctx.drawImage(imgPreview, 0, 0, canvas.width, canvas.height);
        if (ctx.filter !== undefined) ctx.filter = 'none';
        if (!filterApplied) {
          try {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
              data[i] = Math.max(0, Math.min(255, (data[i] - 128) * 1.15 + 128 + 25));
              data[i+1] = Math.max(0, Math.min(255, (data[i+1] - 128) * 1.15 + 128 + 25));
              data[i+2] = Math.max(0, Math.min(255, (data[i+2] - 128) * 1.15 + 128 + 25));
            }
            ctx.putImageData(imgData, 0, 0);
          } catch (e) { console.warn(e); }
        }

        const detection = await faceapi.detectSingleFace(canvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.15 })).withFaceLandmarks().withFaceDescriptor();
        overlay.classList.add('hidden');

        if (!detection) {
          st.textContent = "ไม่พบใบหน้า!"; st.className = "text-rose-400 text-xs font-bold";
          return Swal.fire({ icon: 'error', title: 'ไม่พบใบหน้า', text: 'รูปไม่ชัดเจน กรุณาถ่ายหน้าตรง ในที่สว่างเพียงพอครับ', confirmButtonText: 'ถ่ายรูปใหม่' }).then(() => openRegisterCamera());
        }

        tempRegisterDescriptor = detection.descriptor;
        st.textContent = "วิเคราะห์สำเร็จ! กดบันทึกเพื่อยืนยัน"; st.className = "text-emerald-400 text-xs font-bold";
        actionArea.classList.remove('hidden'); actionArea.classList.add('flex');
        hintText.classList.remove('hidden');
      } catch (e) {
        console.error("Analysis Error:", e);
        overlay.classList.add('hidden');
        Swal.fire({ icon: 'error', title: 'วิเคราะห์ภาพล้มเหลว', text: `เกิดข้อผิดพลาด: ${e.message}` });
      }
    };
  }

  async function saveFaceRegistration() {
    if (!tempRegisterDescriptor) return;
    Swal.fire({ title: 'กำลังบันทึกข้อมูล...', text: 'ระบบกำลังนำข้อมูลโครงหน้าของคุณบันทึกลงฐานข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    try {
      const userId = getHashParam('uid');
      const token = getHashParam('token'); // JWT จากแอป (จำเป็นต่อ RLS อัปเดต users)
      const descriptorArray = Array.from(tempRegisterDescriptor);

      const res = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${token || SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ data_face_id: descriptorArray })
      });
      if (!res.ok) throw new Error(await res.text() || "ไม่สามารถอัปเดตฐานข้อมูลได้");

      Swal.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ', text: 'ระบบบันทึกข้อมูลใบหน้าเรียบร้อยแล้ว ตอนนี้คุณสามารถสแกนหน้าเพื่อลงเวลาได้เลยครับ', confirmButtonColor: '#10b981' }).then(goBackToApp);
    } catch (e) {
      console.error(e);
      Swal.fire('ข้อผิดพลาด', e.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error');
    }
  }

  window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); initFaceRegistration(); });
</script>
</body>
</html>

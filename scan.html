<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกนลงเวลา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> * { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-900">

<div class="fixed inset-0 z-[100] w-full h-full bg-slate-900 flex flex-col">
  <!-- Header -->
  <div class="w-full p-5 flex justify-between items-center bg-slate-900/80 backdrop-blur-md relative z-30">
    <div>
      <h2 class="text-white font-black text-lg">สแกนลงเวลา</h2>
      <p id="inapp-status-text" class="text-amber-400 text-xs font-bold animate-pulse">กำลังเตรียมระบบ...</p>
    </div>
    <button onclick="goBackToApp()" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-rose-500 transition-colors">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="relative w-full h-full flex-1 flex items-center justify-center bg-black overflow-hidden">
    <!-- กล้องสด -->
    <video id="cam" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1] hidden"></video>
    <!-- กรอบไกด์ใบหน้า -->
    <div id="cam-guide" class="absolute inset-0 hidden items-center justify-center pointer-events-none">
      <div class="w-56 h-56 border-2 border-emerald-400/70 rounded-full shadow-[0_0_40px_rgba(16,185,129,0.4)]"></div>
    </div>

    <!-- ก่อนเริ่ม -->
    <div id="inapp-camera-placeholder" class="text-center flex flex-col items-center justify-center px-6">
      <div class="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mb-4 border border-emerald-500/30">
        <i data-lucide="scan-face" class="w-10 h-10 text-emerald-400"></i>
      </div>
      <p class="text-slate-400 text-sm font-medium mb-6">กดเริ่มสแกน ระบบจะเปิดกล้องและจับใบหน้าให้อัตโนมัติ</p>
      <button onclick="startScanFlow()" id="btn-inapp-camera" disabled class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white rounded-full font-bold shadow-lg shadow-emerald-500/30 flex items-center gap-2 active:scale-95 transition-all">
        <i data-lucide="camera" class="w-5 h-5"></i> <span id="btn-inapp-label">กำลังเตรียม...</span>
      </button>
    </div>

    <!-- สถานะกำลังสแกน (ลอยล่าง) -->
    <div id="inapp-scanning-badge" class="absolute bottom-24 left-1/2 -translate-x-1/2 hidden">
      <span class="text-xs font-bold text-white bg-emerald-600/90 px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> กำลังค้นหาใบหน้า...
      </span>
    </div>

    <!-- ผลลัพธ์สำเร็จ -->
    <div id="inapp-result" class="absolute inset-0 bg-slate-900 flex-col items-center justify-center hidden px-8 z-40 text-center">
      <div class="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mb-5 border border-emerald-500/40">
        <i data-lucide="check" class="w-12 h-12 text-emerald-400"></i>
      </div>
      <h3 class="text-white font-black text-xl">ลงเวลาสำเร็จ</h3>
      <p id="inapp-result-text" class="text-slate-300 text-sm mt-2 whitespace-pre-line"></p>
      <button onclick="goBackToApp()" class="mt-8 px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full font-bold shadow-lg active:scale-95">กลับสู่แอป</button>
    </div>

    <!-- บล็อกอุปกรณ์ไม่ใช่มือถือ -->
    <div id="device-block" class="absolute inset-0 bg-slate-900 flex-col items-center justify-center hidden px-8 z-50 text-center">
      <div class="w-24 h-24 bg-rose-500/20 rounded-full flex items-center justify-center mb-5 border border-rose-500/40">
        <i data-lucide="smartphone" class="w-12 h-12 text-rose-400"></i>
      </div>
      <h3 class="text-white font-black text-xl">กรุณาเปิดจากมือถือหรือ iPad</h3>
      <p class="text-slate-400 text-sm mt-2">ระบบสแกนลงเวลารองรับเฉพาะโทรศัพท์มือถือหรือแท็บเล็ตเท่านั้น</p>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://lykcbppxbpnkipjhnqyk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2NicHB4YnBua2lwamhucXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwOTUwOTEsImV4cCI6MjA5MjY3MTA5MX0.bstoZYd8f0vC3FKnAr15S5AKuQtiT-wD019rc96e21k';

  let INAPP_IS_TESTING = false;
  const inAppSchoolPolygon = [
    {lat:12.785238898383794, lng:99.91365373134613}, {lat:12.78599745238914, lng:99.91338819265366}, {lat:12.785939906992754, lng:99.91311192512512}, {lat:12.786957412294308, lng:99.91276323795319}, {lat:12.786894635736306, lng:99.91252452135086}, {lat:12.787373306596795, lng:99.9123340845108}, {lat:12.78749362809111, lng:99.91252183914185}, {lat:12.788314951542185, lng:99.91226702928543}, {lat:12.7884588136551, lng:99.91263717412949}, {lat:12.786667070582686, lng:99.9133238196373}, {lat:12.786936486776709, lng:99.91428673267365}, {lat:12.783787176605763, lng:99.91540253162384}, {lat:12.783400049388725, lng:99.91421163082123}, {lat:12.784216154720637, lng:99.91395145654678}, {lat:12.784025207235116, lng:99.9134686589241}, {lat:12.783999050034073, lng:99.91337478160858}, {lat:12.783821180995126, lng:99.91340696811676}, {lat:12.783758403657343, lng:99.91309851408005}, {lat:12.78491193474759, lng:99.91268545389175}
  ];

  let myFaceDescriptor = null;
  let currentUserData = null;
  let camStream = null;
  let scanning = false;
  let detectBusy = false;
  let lastMismatchAt = 0;

  function getHashParam(k) { return new URLSearchParams((location.hash || '').replace(/^#/, '')).get(k); }
  function isMobileOrTablet() {
    const ua = navigator.userAgent || '';
    const iPadOS13 = navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
    const mobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet|Silk|Kindle|PlayBook/i.test(ua);
    return mobileUA || iPadOS13;
  }
  function setStatus(txt, cls) {
    const el = document.getElementById('inapp-status-text');
    el.textContent = txt;
    el.className = (cls || 'text-amber-400') + ' text-xs font-bold';
  }
  function goBackToApp() {
    stopCamera();
    try { window.close(); } catch (e) {}
    setTimeout(() => { document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Sarabun,sans-serif;text-align:center;padding:24px">เสร็จสิ้น — กลับไปที่แอป HR ได้เลยครับ<br>(ปิดแท็บนี้)</div>'; }, 300);
  }

  async function loadFaceScanConfig() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/system_configs?config_key=eq.face_scan_testing_mode&select=config_value`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      if (res.ok) { const d = await res.json(); if (d.length) INAPP_IS_TESTING = (String(d[0].config_value).trim().toLowerCase() === 'true'); }
    } catch (e) { console.warn('โหลด config ไม่ได้ ใช้ค่า default (false)', e); }
  }

  function checkInAppGPS(point, vs) {
    let x = point.lat, y = point.lng, inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].lat, yi = vs[i].lng, xj = vs[j].lat, yj = vs[j].lng;
      let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  // โหลดโมเดล + descriptor ของผู้ใช้ (เตรียมไว้ก่อน) → ปลดล็อกปุ่มเริ่ม
  async function prepareScan() {
    try {
      const userId = getHashParam('uid');
      const res = await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${userId}&select=id,face_scan_id,first_name,last_name,data_face_id`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      if (!res.ok) throw new Error("โหลดข้อมูลไม่ได้");
      const userData = await res.json();
      if (userData.length === 0 || !userData[0].data_face_id) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่ได้ลงทะเบียน', text: 'คุณยังไม่ได้ลงทะเบียนใบหน้า กรุณาลงทะเบียนที่เมนู "ลงทะเบียนหน้า" ก่อนครับ' }).then(goBackToApp);
        return;
      }
      const u = userData[0];
      let rawData = u.data_face_id;
      if (typeof rawData === 'string') { try { rawData = JSON.parse(rawData); } catch (e) {} }
      if (rawData && typeof rawData === 'object' && !Array.isArray(rawData)) rawData = Object.values(rawData);
      if (Array.isArray(rawData) && rawData.length === 128) {
        myFaceDescriptor = new Float32Array(rawData);
        currentUserData = { id: u.id, face_scan_id: u.face_scan_id, name: `${u.first_name} ${u.last_name}` };
      } else throw new Error("ข้อมูลใบหน้าของคุณไม่สมบูรณ์ กรุณาลงทะเบียนใหม่");

      setStatus("กำลังโหลดระบบ AI...", 'text-blue-400');
      if (!window.faceapi.nets.ssdMobilenetv1.isLoaded) {
        const MODEL_URL = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
      }
      setStatus("พร้อมแล้ว — กดเริ่มสแกน", 'text-emerald-400');
      const btn = document.getElementById('btn-inapp-camera');
      btn.disabled = false;
      document.getElementById('btn-inapp-label').textContent = 'เริ่มสแกน';
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: e.message }).then(goBackToApp);
    }
  }

  // กดเริ่ม → เช็ก GPS → เปิดกล้อง → ลูปจับหน้า
  function startScanFlow() {
    if (!navigator.geolocation) {
      if (INAPP_IS_TESTING) return beginCamera();
      return Swal.fire({ icon: 'error', title: 'ไม่พบ GPS', text: 'อุปกรณ์ไม่รองรับพิกัด' }).then(goBackToApp);
    }
    setStatus("กำลังตรวจสอบพื้นที่ (GPS)...", 'text-amber-400');
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const userLoc = { lat: position.coords.latitude, lng: position.coords.longitude };
        if (!INAPP_IS_TESTING && !checkInAppGPS(userLoc, inAppSchoolPolygon)) {
          Swal.fire({ icon: 'error', title: 'อยู่นอกพื้นที่', text: 'ไม่สามารถลงเวลาได้ คุณอยู่นอกพื้นที่โรงเรียน' }).then(goBackToApp);
          return;
        }
        beginCamera();
      },
      () => { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'กรุณาเปิด GPS และอนุญาตการเข้าถึงตำแหน่ง' }).then(goBackToApp); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  async function beginCamera() {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
      const video = document.getElementById('cam');
      video.srcObject = camStream;
      await video.play();
      document.getElementById('inapp-camera-placeholder').classList.add('hidden');
      video.classList.remove('hidden');
      document.getElementById('cam-guide').classList.remove('hidden');
      document.getElementById('cam-guide').classList.add('flex');
      document.getElementById('inapp-scanning-badge').classList.remove('hidden');
      setStatus("กำลังสแกน — หันหน้าเข้ากล้อง", 'text-emerald-400');
      scanning = true;
      detectLoop();
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'เปิดกล้องไม่ได้', text: 'กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ แล้วลองใหม่' }).then(goBackToApp);
    }
  }

  function stopCamera() {
    scanning = false;
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  }

  function videoToCanvas() {
    const video = document.getElementById('cam');
    if (!video.videoWidth) return null;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const MAX_WIDTH = 600;
    let scaleSize = video.videoWidth > MAX_WIDTH ? MAX_WIDTH / video.videoWidth : 1;
    canvas.width = video.videoWidth * scaleSize;
    canvas.height = video.videoHeight * scaleSize;
    if (ctx.filter !== undefined) ctx.filter = 'brightness(1.12) contrast(1.08)';
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    if (ctx.filter !== undefined) ctx.filter = 'none';
    return canvas;
  }

  async function detectLoop() {
    if (!scanning) return;
    if (!detectBusy && (Date.now() - lastMismatchAt > 1500)) {
      detectBusy = true;
      try {
        const canvas = videoToCanvas();
        if (canvas) {
          const det = await faceapi.detectSingleFace(canvas, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 })).withFaceLandmarks().withFaceDescriptor();
          if (det && det.detection.score >= 0.5) {
            const distance = faceapi.euclideanDistance(det.descriptor, myFaceDescriptor);
            if (distance <= 0.45) {
              scanning = false;
              setStatus("ยืนยันตัวตนสำเร็จ!", 'text-emerald-400');
              document.getElementById('inapp-scanning-badge').classList.add('hidden');
              stopCamera();
              recordInAppAttendance();
              detectBusy = false;
              return;
            } else {
              lastMismatchAt = Date.now();
              setStatus("ใบหน้าไม่ตรง — กำลังสแกนต่อ...", 'text-rose-400');
            }
          }
        }
      } catch (e) { console.warn(e); }
      detectBusy = false;
    }
    setTimeout(detectLoop, 700);
  }

  async function recordInAppAttendance() {
    setStatus("กำลังประมวลผลเวลาทำงาน...", 'text-emerald-400');
    const now = new Date();
    const localNow = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
    const scanDate = localNow.toISOString().split('T')[0];
    const scanTime = localNow.toISOString().split('T')[1].substring(0, 8);

    const isGuard = currentUserData.face_scan_id && currentUserData.face_scan_id.startsWith('9');
    let scanAction = 'none';
    if (isGuard) scanAction = 'any';
    else {
      if (scanTime >= '04:00:00' && scanTime <= '14:00:00') scanAction = 'in';
      else if (scanTime >= '14:00:01' && scanTime <= '23:59:59') scanAction = 'out';
      else { Swal.fire({ icon: 'warning', title: 'นอกช่วงเวลา', text: 'อนุญาตให้สแกน (04:00-14:00) และ (14:01-23:59) เท่านั้น' }).then(goBackToApp); return; }
    }

    try {
      const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };
      const [rawDaily, rawRef, rawRound, rawHol, rawDormHol, rawSpecial] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/daily_attendance_records?user_id=eq.${currentUserData.id}&attendance_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/dbprocessattendance?user_id=eq.${currentUserData.id}&attendance_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/attendance_round_settings?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/holidays?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/dorm_holidays?user_id=eq.${currentUserData.id}&holiday_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/special_work_periods?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers })
      ]);
      const [dailyRecs, refLeaves, roundSets, holidays, dormHols, specialPeriods] = await Promise.all([
        rawDaily.ok ? rawDaily.json() : [], rawRef.ok ? rawRef.json() : [],
        rawRound.ok ? rawRound.json() : [], rawHol.ok ? rawHol.json() : [],
        rawDormHol.ok ? rawDormHol.json() : [], rawSpecial.ok ? rawSpecial.json() : []
      ]);

      const refData = refLeaves.length > 0 ? refLeaves[0] : null;
      const dailyData = dailyRecs.length > 0 ? dailyRecs[0] : null;
      const defaultLate = roundSets.length > 0 ? (roundSets[0].late_time || '08:00:00') : '08:00:00';
      const defaultOff = roundSets.length > 0 ? (roundSets[0].off_work_time || '16:30:00') : '16:30:00';
      const sp = specialPeriods.length > 0 ? specialPeriods[0] : null;
      const LATE_TIME = sp ? sp.late_time : defaultLate;
      const OFF_WORK_TIME = sp ? sp.off_work_time : defaultOff;

      const dObj = new Date(scanDate + "T00:00:00");
      const isPublicHol = (dObj.getDay() === 0 || dObj.getDay() === 6) || holidays.length > 0;
      const isDormHol = dormHols.length > 0;
      const isAnyHoliday = isPublicHol || isDormHol;
      const holidayRemarkText = isDormHol && !isPublicHol ? 'วันหยุดครูหอพัก' : 'วันหยุด';

      let timeIn = dailyData ? dailyData.time_in : null;
      let timeOut = dailyData ? dailyData.time_out : null;
      if (isGuard) {
        if (!timeIn) { timeIn = scanTime; timeOut = scanTime; }
        else { timeIn = timeIn < scanTime ? timeIn : scanTime; timeOut = timeOut > scanTime ? timeOut : scanTime; }
      } else {
        if (scanAction === 'in') timeIn = timeIn ? (timeIn < scanTime ? timeIn : scanTime) : scanTime;
        else if (scanAction === 'out') { timeOut = timeOut ? (timeOut > scanTime ? timeOut : scanTime) : scanTime; if (!timeIn) timeIn = scanTime; }
      }

      const tInShort = timeIn ? timeIn.substring(0, 5) : '-';
      const tOutShort = timeOut ? timeOut.substring(0, 5) : '-';
      let recordType = isAnyHoliday ? 'holiday' : 'present';
      let subType = 'no_data';
      let remark = '-';
      const isLate = timeIn > LATE_TIME;
      const isLeaveEarly = (timeOut < OFF_WORK_TIME) && (timeIn !== timeOut);
      const isSingleScan = (timeIn === timeOut || !timeOut);

      if (refData) {
        if (refData.record_type === 'out') {
          recordType = 'present';
          if (isLate) { subType = 'late'; remark = `ออกนอกสถานศึกษา (มาสาย ${tInShort})`; }
          else { subType = 'normal'; remark = `มาทำงานปกติ (ออกนอกฯ)`; }
        } else { recordType = refData.record_type; subType = refData.sub_type || 'normal'; remark = refData.remark || 'มีเอกสารอ้างอิง'; }
      } else {
        if (isAnyHoliday) { subType = 'work_on_holiday'; remark = `มาทำวันหยุด (${holidayRemarkText})`; }
        else if (isSingleScan && scanAction === 'in') { subType = isLate ? 'late' : 'normal'; remark = isLate ? `มาสาย (เข้า: ${tInShort})` : `มาทำงานปกติ (เข้า: ${tInShort})`; }
        else if (isLate && isLeaveEarly) { subType = 'late_and_early'; remark = `เข้า: ${tInShort} | ออก: ${tOutShort}`; }
        else if (isLate) { subType = 'late'; remark = `เข้า: ${tInShort} | ออก: ${tOutShort}`; }
        else if (isLeaveEarly) { subType = 'leave_early'; remark = `เข้า: ${tInShort} | ออก: ${tOutShort}`; }
        else { subType = 'normal'; remark = `เข้า: ${tInShort} | ออก: ${tOutShort}`; }
      }
      if (isGuard && isSingleScan) { recordType = 'present'; subType = 'evening_shift'; remark = `เข้างานช่วงเย็น [เวลา: ${tInShort}]`; }

      const payloadLog = { machine_id: 'GitHubPages_Scan', face_scan_id: currentUserData.face_scan_id, scan_date: scanDate, scan_time: scanTime, original_log: `Web Live Match (${scanAction})`, status: 'processed' };
      const payloadDaily = { user_id: currentUserData.id, attendance_date: scanDate, time_in: timeIn, time_out: timeOut, record_type: recordType, sub_type: subType, remark: remark };
      const urlDaily = dailyData ? `${SUPABASE_URL}/rest/v1/daily_attendance_records?id=eq.${dailyData.id}` : `${SUPABASE_URL}/rest/v1/daily_attendance_records`;

      await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/raw_attendance_logs`, { method: 'POST', headers, body: JSON.stringify(payloadLog) }),
        fetch(urlDaily, { method: dailyData ? 'PATCH' : 'POST', headers, body: JSON.stringify(payloadDaily) })
      ]);

      document.getElementById('cam').classList.add('hidden');
      document.getElementById('cam-guide').classList.add('hidden');
      document.getElementById('inapp-result-text').textContent = `${currentUserData.name}\n${remark}`;
      const resultEl = document.getElementById('inapp-result');
      resultEl.classList.remove('hidden'); resultEl.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    } catch (e) {
      console.error(e);
      Swal.fire({ icon: 'error', title: 'การบันทึกข้อมูลล้มเหลว', text: 'สแกนหน้าผ่านแล้ว แต่ไม่สามารถบันทึกข้อมูลลงระบบได้' }).then(goBackToApp);
    }
  }

  async function init() {
    if (window.lucide) lucide.createIcons();
    await loadFaceScanConfig();
    if (!INAPP_IS_TESTING && !isMobileOrTablet()) {
      document.getElementById('inapp-camera-placeholder').classList.add('hidden');
      const b = document.getElementById('device-block');
      b.classList.remove('hidden'); b.classList.add('flex');
      setStatus("อุปกรณ์ไม่รองรับ", 'text-rose-400');
      return;
    }
    if (!getHashParam('uid')) {
      Swal.fire({ icon: 'error', title: 'ลิงก์ไม่ถูกต้อง', text: 'ไม่พบรหัสผู้ใช้ กรุณาเปิดจากแอปอีกครั้ง' });
      return;
    }
    await prepareScan();
  }
  window.addEventListener('load', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สแกนใบหน้าลงเวลา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', sans-serif; }
    .sheet { transition: transform .3s cubic-bezier(.4,0,.2,1); }
    .sheet.hidden-sheet { transform: translateY(110%); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.1); opacity: 1 } 100% { transform: scale(1) } }
    .pop { animation: pop .35s ease-out; }
  </style>
</head>
<body class="bg-slate-900 text-white overflow-hidden">

<div class="fixed inset-0 flex flex-col">
  <!-- Header + Stepper -->
  <div class="px-5 pt-5 pb-3 bg-slate-900/90 backdrop-blur-md z-30 shrink-0">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-black text-base">สแกนใบหน้าลงเวลา</h2>
      <button onclick="backToApp()" class="w-9 h-9 bg-white/10 rounded-full flex items-center justify-center text-slate-300 hover:bg-rose-500 hover:text-white transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="stepper" class="flex items-center gap-1.5"></div>
  </div>

  <!-- Camera stage -->
  <div class="relative flex-1 bg-black overflow-hidden flex items-center justify-center">
    <video id="cam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform scale-x-[-1] hidden"></video>

    <!-- face guide + countdown -->
    <div id="guide" class="absolute inset-0 hidden items-center justify-center pointer-events-none">
      <div class="relative w-64 h-64 rounded-full border-[3px] border-emerald-400/70 shadow-[0_0_50px_rgba(16,185,129,0.45)] flex items-center justify-center">
        <span id="countdown" class="text-7xl font-black text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.7)]"></span>
      </div>
    </div>

    <!-- idle / start -->
    <div id="screen-start" class="relative z-10 text-center px-8 flex flex-col items-center">
      <div class="w-24 h-24 bg-emerald-500/20 border border-emerald-500/30 rounded-full flex items-center justify-center mb-5">
        <i data-lucide="scan-face" class="w-12 h-12 text-emerald-400"></i>
      </div>
      <p class="text-slate-300 text-sm mb-7 max-w-xs">กดเริ่ม ระบบจะเปิดกล้อง ให้จัดใบหน้าอยู่ในวงกลม แล้วนับถอยหลังอัตโนมัติ</p>
      <button id="btn-start" onclick="startFlow()" disabled class="px-10 py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 rounded-full font-bold shadow-lg shadow-emerald-500/30 flex items-center gap-2 active:scale-95 transition-all">
        <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> <span id="btn-start-label">กำลังเตรียม...</span>
      </button>
    </div>

    <!-- device block -->
    <div id="screen-block" class="relative z-20 text-center px-8 hidden flex-col items-center">
      <div class="w-24 h-24 bg-rose-500/20 border border-rose-500/40 rounded-full flex items-center justify-center mb-5"><i data-lucide="smartphone" class="w-12 h-12 text-rose-400"></i></div>
      <h3 class="font-black text-xl">กรุณาเปิดจากมือถือหรือ iPad</h3>
      <p class="text-slate-400 text-sm mt-2">ระบบรองรับเฉพาะโทรศัพท์มือถือหรือแท็บเล็ตเท่านั้น</p>
    </div>

    <!-- bottom status bar while scanning -->
    <div id="hint-bar" class="absolute bottom-5 left-1/2 -translate-x-1/2 hidden">
      <span id="hint-text" class="text-sm font-bold bg-black/55 backdrop-blur px-5 py-2.5 rounded-full">จัดใบหน้าให้อยู่ในวงกลม</span>
    </div>
  </div>

  <!-- secondary action -->
  <div id="bottom-actions" class="px-5 py-4 bg-slate-900 shrink-0 hidden">
    <button onclick="openManualSheet()" class="w-full py-3 bg-white/5 border border-white/10 rounded-2xl text-sm font-bold text-slate-300 flex items-center justify-center gap-2 active:scale-95">
      <i data-lucide="search" class="w-4 h-4"></i> สแกนไม่ผ่าน? เลือกชื่อตัวเองก่อน
    </button>
  </div>
</div>

<!-- Bottom Sheet (top3 / manual / result) -->
<div id="sheet-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden"></div>
<div id="sheet" class="sheet hidden-sheet fixed bottom-0 left-0 right-0 z-50 bg-slate-800 rounded-t-3xl border-t border-white/10 shadow-2xl max-h-[80vh] flex flex-col">
  <div class="flex justify-center pt-3"><div class="w-12 h-1.5 bg-white/20 rounded-full"></div></div>
  <div class="px-5 pt-2 pb-3 flex items-center justify-between">
    <h3 id="sheet-title" class="font-black text-base"></h3>
    <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>
  <div id="sheet-body" class="px-5 pb-7 overflow-y-auto custom-scrollbar"></div>
</div>

<script>
  const SUPABASE_URL = 'https://lykcbppxbpnkipjhnqyk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2NicHB4YnBua2lwamhucXlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwOTUwOTEsImV4cCI6MjA5MjY3MTA5MX0.bstoZYd8f0vC3FKnAr15S5AKuQtiT-wD019rc96e21k';

  const Toast = Swal.mixin({ toast: true, position: 'bottom', showConfirmButton: false, timer: 2600, timerProgressBar: true });
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  let IS_TESTING = false;
  let faceDb = [];
  let manualTargetFaceId = null;
  let camStream = null, scanning = false, counting = false;
  const RETURN_URL = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('return') || '';

  const STEPS = ['เริ่ม', 'จัดใบหน้า', 'ตรวจสอบ', 'สำเร็จ'];
  function setStep(active) {
    document.getElementById('stepper').innerHTML = STEPS.map((s, i) => {
      const done = i < active, cur = i === active;
      const dot = done ? 'bg-emerald-500 text-white' : cur ? 'bg-emerald-400 text-slate-900' : 'bg-white/10 text-slate-400';
      const line = i < STEPS.length - 1 ? `<div class="flex-1 h-0.5 ${i < active ? 'bg-emerald-500' : 'bg-white/10'}"></div>` : '';
      return `<div class="flex items-center gap-1.5">
        <div class="w-6 h-6 rounded-full ${dot} text-[11px] font-black flex items-center justify-center shrink-0">${done ? '✓' : (i + 1)}</div>
        <span class="text-[11px] font-bold ${cur ? 'text-white' : 'text-slate-500'} hidden xs:inline">${s}</span>
      </div>${line}`;
    }).join('');
  }
  function setHint(t) { document.getElementById('hint-text').textContent = t; }

  const schoolPolygon = [
    { lat: 12.785238898383794, lng: 99.91365373134613 }, { lat: 12.78599745238914, lng: 99.91338819265366 }, { lat: 12.785939906992754, lng: 99.91311192512512 }, { lat: 12.786957412294308, lng: 99.91276323795319 }, { lat: 12.786894635736306, lng: 99.91252452135086 }, { lat: 12.787373306596795, lng: 99.9123340845108 }, { lat: 12.78749362809111, lng: 99.91252183914185 }, { lat: 12.788314951542185, lng: 99.91226702928543 }, { lat: 12.7884588136551, lng: 99.91263717412949 }, { lat: 12.786667070582686, lng: 99.9133238196373 }, { lat: 12.786936486776709, lng: 99.91428673267365 }, { lat: 12.783787176605763, lng: 99.91540253162384 }, { lat: 12.783400049388725, lng: 99.91421163082123 }, { lat: 12.784216154720637, lng: 99.91395145654678 }, { lat: 12.784025207235116, lng: 99.9134686589241 }, { lat: 12.783999050034073, lng: 99.91337478160858 }, { lat: 12.783821180995126, lng: 99.91340696811676 }, { lat: 12.783758403657343, lng: 99.91309851408005 }, { lat: 12.78491193474759, lng: 99.91268545389175 }
  ];
  function isPointInPolygon(point, vs) {
    let x = point.lat, y = point.lng, inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      let xi = vs[i].lat, yi = vs[i].lng, xj = vs[j].lat, yj = vs[j].lng;
      let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }
  function isMobileOrTablet() {
    const ua = navigator.userAgent || '';
    const iPadOS13 = navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1;
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet|Silk|Kindle|PlayBook/i.test(ua) || iPadOS13;
  }
  function backToApp() {
    stopCamera();
    if (RETURN_URL) location.href = RETURN_URL + (RETURN_URL.indexOf('?') === -1 ? '?' : '&') + 'page=mobile';
    else { try { window.close(); } catch (e) {} }
  }
  function redirectWithResult(uid, name) {
    stopCamera();
    if (RETURN_URL) location.href = RETURN_URL + (RETURN_URL.indexOf('?') === -1 ? '?' : '&') + 'page=mobile&scanned_uid=' + encodeURIComponent(uid) + '&scanned_name=' + encodeURIComponent(name);
    else Swal.fire({ icon: 'success', title: 'ลงเวลาสำเร็จ', text: name, confirmButtonColor: '#10b981' });
  }

  // ---- bottom sheet ----
  function openSheet(title, bodyHtml) {
    document.getElementById('sheet-title').textContent = title;
    document.getElementById('sheet-body').innerHTML = bodyHtml;
    document.getElementById('sheet-backdrop').classList.remove('hidden');
    document.getElementById('sheet').classList.remove('hidden-sheet');
    if (window.lucide) lucide.createIcons();
  }
  function closeSheet() {
    document.getElementById('sheet').classList.add('hidden-sheet');
    document.getElementById('sheet-backdrop').classList.add('hidden');
  }

  async function loadFaceScanConfig() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/system_configs?config_key=eq.face_scan_testing_mode&select=config_value`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
      if (res.ok) { const d = await res.json(); if (d.length) IS_TESTING = (String(d[0].config_value).trim().toLowerCase() === 'true'); }
    } catch (e) { console.warn(e); }
  }

  function startFlow() {
    setStep(1);
    document.getElementById('screen-start').classList.add('hidden');
    if (!navigator.geolocation) { if (IS_TESTING) return loadAndStart(); return errBack("อุปกรณ์ของคุณไม่รองรับ GPS"); }
    setHint("กำลังตรวจสอบพื้นที่ (GPS)...");
    document.getElementById('hint-bar').classList.remove('hidden');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (!IS_TESTING && !isPointInPolygon(loc, schoolPolygon)) return errBack("คุณอยู่นอกพื้นที่โรงเรียน ไม่สามารถลงเวลาได้");
        loadAndStart();
      },
      () => { if (IS_TESTING) loadAndStart(); else errBack("กรุณาเปิด GPS และอนุญาตการเข้าถึงตำแหน่ง"); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }
  function errBack(msg) { Swal.fire({ icon: 'error', title: 'ไม่สามารถทำรายการได้', text: msg, confirmButtonText: 'กลับ' }).then(backToApp); }

  async function loadAndStart() {
    try {
      setHint("กำลังโหลดข้อมูล...");
      if (faceDb.length === 0) {
        const res = await fetch(SUPABASE_URL + '/rest/v1/users?select=id,first_name,last_name,face_scan_id,data_face_id&not.data_face_id.is.null', { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if (!res.ok) throw new Error("โหลดข้อมูลไม่ได้");
        const users = await res.json();
        faceDb = users.map(u => {
          let r = u.data_face_id; if (typeof r === 'string') { try { r = JSON.parse(r); } catch (e) {} }
          if (r && typeof r === 'object' && !Array.isArray(r)) r = Object.values(r);
          let d = new Float32Array(128); if (Array.isArray(r) && r.length === 128) d = new Float32Array(r);
          return { id: u.id, face_scan_id: u.face_scan_id, name: `${u.first_name} ${u.last_name}`, descriptor: d };
        }).filter(u => u.descriptor[0] !== 0 || u.descriptor[1] !== 0);
      }
      await beginCamera();
    } catch (e) { console.error(e); errBack("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล"); }
  }

  async function beginCamera() {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
      const v = document.getElementById('cam'); v.srcObject = camStream; await v.play();
      v.classList.remove('hidden');
      document.getElementById('guide').classList.remove('hidden'); document.getElementById('guide').classList.add('flex');
      document.getElementById('hint-bar').classList.remove('hidden');
      document.getElementById('bottom-actions').classList.remove('hidden');
      setStep(1); setHint("จัดใบหน้าให้อยู่ในวงกลม");
      scanning = true; counting = false;
      loop();
    } catch (e) { console.error(e); errBack("เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์"); }
  }
  function stopCamera() { scanning = false; counting = false; if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }

  function grab() {
    const v = document.getElementById('cam'); if (!v.videoWidth) return null;
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    let s = v.videoWidth > 600 ? 600 / v.videoWidth : 1; c.width = v.videoWidth * s; c.height = v.videoHeight * s;
    if (ctx.filter !== undefined) ctx.filter = 'brightness(1.12) contrast(1.08)';
    ctx.drawImage(v, 0, 0, c.width, c.height); if (ctx.filter !== undefined) ctx.filter = 'none';
    return c;
  }
  async function detectDescriptor() {
    const c = grab(); if (!c) return null;
    const det = await faceapi.detectSingleFace(c, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.4 })).withFaceLandmarks().withFaceDescriptor();
    return (det && det.detection.score >= 0.5) ? det.descriptor : null;
  }

  // รอจนเจอใบหน้า → นับถอยหลัง 3-2-1 (เช็คว่าหน้ายังอยู่ทุกวินาที) → ประเมิน
  async function loop() {
    if (!scanning || counting) return;
    const d = await detectDescriptor();
    if (d) { startCountdown(); return; }
    setHint("จัดใบหน้าให้อยู่ในวงกลม");
    if (scanning && !counting) setTimeout(loop, 450);
  }
  async function startCountdown() {
    counting = true; setStep(2);
    let last = null;
    for (let n = 3; n >= 1; n--) {
      document.getElementById('countdown').textContent = n;
      document.getElementById('countdown').classList.remove('pop'); void document.getElementById('countdown').offsetWidth; document.getElementById('countdown').classList.add('pop');
      setHint("นิ่งไว้...");
      await sleep(750);
      const d = await detectDescriptor();
      if (!d) { // หน้าหลุดกรอบ → ยกเลิก
        document.getElementById('countdown').textContent = '';
        counting = false; setStep(1); setHint("จัดใบหน้าให้อยู่ในวงกลม");
        if (scanning) loop();
        return;
      }
      last = d;
    }
    document.getElementById('countdown').textContent = '';
    counting = false; scanning = false; setStep(2); setHint("กำลังตรวจสอบ...");
    evaluate(last);
  }

  function evaluate(descriptor) {
    if (manualTargetFaceId) {
      const t = faceDb.find(u => u.face_scan_id === manualTargetFaceId);
      if (t && faceapi.euclideanDistance(descriptor, t.descriptor) <= 0.45) return handleSuccess(t);
      Toast.fire({ icon: 'error', title: 'ใบหน้าไม่ตรงกับชื่อที่เลือก' }); return resumeScan();
    }
    let matches = faceDb.map(u => ({ ...u, distance: faceapi.euclideanDistance(descriptor, u.descriptor) })).sort((a, b) => a.distance - b.distance);
    const best = matches[0];
    if (best && best.distance <= 0.35) return handleSuccess(best);
    if (best && best.distance <= 0.5) return showTop3(matches.filter(m => m.distance <= 0.5).slice(0, 3));
    Toast.fire({ icon: 'warning', title: 'ไม่พบข้อมูลใบหน้า — ลองใหม่อีกครั้ง' });
    resumeScan();
  }
  function resumeScan() { manualTargetFaceId = null; scanning = true; counting = false; setStep(1); setHint("จัดใบหน้าให้อยู่ในวงกลม"); loop(); }

  function showTop3(list) {
    const body = list.map(u => `
      <button onclick="pickUser('${u.face_scan_id}')" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 p-4 rounded-2xl flex items-center gap-3 mb-2.5 text-left active:scale-[0.98]">
        <div class="w-10 h-10 bg-indigo-500/20 text-indigo-300 rounded-full flex items-center justify-center font-black shrink-0">${u.name.substring(0, 1)}</div>
        <div class="flex-1"><p class="font-bold text-sm">${u.name}</p><p class="text-emerald-400 text-[11px] font-semibold">ความใกล้เคียง ${Math.round((1 - u.distance) * 100)}%</p></div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
      </button>`).join('') + `<button onclick="closeSheet(); resumeScan();" class="w-full py-3 mt-2 border border-white/10 rounded-2xl text-sm font-bold text-slate-300">สแกนใหม่</button>`;
    openSheet('เลือกชื่อที่ถูกต้อง', body);
  }
  function pickUser(faceScanId) { closeSheet(); handleSuccess(faceDb.find(u => u.face_scan_id === faceScanId)); }

  function openManualSheet() {
    const opts = faceDb.slice().sort((a, b) => a.name.localeCompare(b.name, 'th'));
    const body = `
      <input id="m-search" oninput="filterManual()" placeholder="ค้นหาชื่อ..." class="w-full mb-3 px-4 py-3 bg-slate-900 border border-white/10 rounded-2xl text-sm outline-none focus:border-emerald-500">
      <div id="m-list" class="space-y-1.5 max-h-[50vh] overflow-y-auto custom-scrollbar"></div>`;
    openSheet('เลือกชื่อของคุณ', body);
    window._mOpts = opts; renderManual('');
  }
  function renderManual(kw) {
    const list = (window._mOpts || []).filter(u => !kw || u.name.toLowerCase().includes(kw.toLowerCase()));
    document.getElementById('m-list').innerHTML = list.length ? list.map(u => `
      <div onclick="chooseManual('${u.face_scan_id}','${u.name.replace(/'/g, "\\'")}')" class="px-4 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-bold cursor-pointer">${u.name}</div>`).join('')
      : `<p class="text-center text-slate-500 text-sm py-6">ไม่พบชื่อ</p>`;
  }
  function filterManual() { renderManual(document.getElementById('m-search').value); }
  function chooseManual(id, name) { manualTargetFaceId = id; closeSheet(); Toast.fire({ icon: 'info', title: 'เลือก: ' + name + ' — จัดใบหน้าในกรอบ' }); }

  async function handleSuccess(userObj) {
    setStep(2); setHint("กำลังลงเวลา...");
    const now = new Date(); const localNow = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    const scanDate = localNow.toISOString().split('T')[0]; const scanTime = localNow.toISOString().split('T')[1].substring(0, 8);
    const isGuard = userObj.face_scan_id && userObj.face_scan_id.startsWith('9');
    let scanAction = 'none';
    if (isGuard) scanAction = 'any';
    else { if (scanTime >= '04:00:00' && scanTime <= '14:00:00') scanAction = 'in'; else if (scanTime >= '14:00:01' && scanTime <= '23:59:59') scanAction = 'out'; else { if (IS_TESTING) scanAction = 'in'; else { Toast.fire({ icon: 'warning', title: 'ไม่อยู่ในช่วงเวลาสแกน' }); return resumeScan(); } } }

    try {
      const headers = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };
      const [rawDaily, rawRef, rawRound, rawHol, rawDormHol, rawSpecial] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/daily_attendance_records?user_id=eq.${userObj.id}&attendance_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/dbprocessattendance?user_id=eq.${userObj.id}&attendance_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/attendance_round_settings?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/holidays?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/dorm_holidays?user_id=eq.${userObj.id}&holiday_date=eq.${scanDate}`, { headers }),
        fetch(`${SUPABASE_URL}/rest/v1/special_work_periods?start_date=lte.${scanDate}&end_date=gte.${scanDate}`, { headers })
      ]);
      const [dailyRecs, refLeaves, roundSets, holidays, dormHols, specialPeriods] = await Promise.all([
        rawDaily.ok ? rawDaily.json() : [], rawRef.ok ? rawRef.json() : [], rawRound.ok ? rawRound.json() : [], rawHol.ok ? rawHol.json() : [], rawDormHol.ok ? rawDormHol.json() : [], rawSpecial.ok ? rawSpecial.json() : []
      ]);
      const refData = refLeaves[0] || null; const dailyData = dailyRecs[0] || null;
      const defaultLate = roundSets.length ? (roundSets[0].late_time || '08:00:00') : '08:00:00';
      const defaultOff = roundSets.length ? (roundSets[0].off_work_time || '16:30:00') : '16:30:00';
      const sp = specialPeriods[0] || null;
      const LATE_TIME = sp ? sp.late_time : defaultLate; const OFF_WORK_TIME = sp ? sp.off_work_time : defaultOff;
      const dObj = new Date(scanDate + "T00:00:00");
      const isPublicHol = (dObj.getDay() === 0 || dObj.getDay() === 6) || holidays.length > 0;
      const isDormHol = dormHols.length > 0; const isAnyHoliday = isPublicHol || isDormHol;
      const holidayRemarkText = isDormHol && !isPublicHol ? 'วันหยุดครูหอพัก' : 'วันหยุด';
      let timeIn = dailyData ? dailyData.time_in : null; let timeOut = dailyData ? dailyData.time_out : null;
      if (isGuard) { if (!timeIn) { timeIn = scanTime; timeOut = scanTime; } else { timeIn = timeIn < scanTime ? timeIn : scanTime; timeOut = timeOut > scanTime ? timeOut : scanTime; } }
      else { if (scanAction === 'in') timeIn = timeIn ? (timeIn < scanTime ? timeIn : scanTime) : scanTime; else if (scanAction === 'out') { timeOut = timeOut ? (timeOut > scanTime ? timeOut : scanTime) : scanTime; if (!timeIn) timeIn = scanTime; } }
      const tIn = timeIn ? timeIn.substring(0, 5) : '-'; const tOut = timeOut ? timeOut.substring(0, 5) : '-';
      let recordType = isAnyHoliday ? 'holiday' : 'present'; let subType = 'no_data'; let remark = '-';
      const isLate = timeIn > LATE_TIME; const isLeaveEarly = (timeOut < OFF_WORK_TIME) && (timeIn !== timeOut); const isSingleScan = (timeIn === timeOut || !timeOut);
      if (refData) {
        if (refData.record_type === 'out') { recordType = 'present'; if (isLate) { subType = 'late'; remark = `ออกนอกสถานศึกษา (มาสาย ${tIn})`; } else { subType = 'normal'; remark = `มาทำงานปกติ (ออกนอกฯ)`; } }
        else { recordType = refData.record_type; subType = refData.sub_type || 'normal'; remark = refData.remark || 'มีเอกสารอ้างอิง'; }
      } else {
        if (isAnyHoliday) { subType = 'work_on_holiday'; remark = `มาทำวันหยุด (${holidayRemarkText})`; }
        else if (isSingleScan && scanAction === 'in') { subType = isLate ? 'late' : 'normal'; remark = isLate ? `มาสาย (เข้า: ${tIn})` : `มาทำงานปกติ (เข้า: ${tIn})`; }
        else if (isLate && isLeaveEarly) { subType = 'late_and_early'; remark = `เข้า: ${tIn} | ออก: ${tOut}`; }
        else if (isLate) { subType = 'late'; remark = `เข้า: ${tIn} | ออก: ${tOut}`; }
        else if (isLeaveEarly) { subType = 'leave_early'; remark = `เข้า: ${tIn} | ออก: ${tOut}`; }
        else { subType = 'normal'; remark = `เข้า: ${tIn} | ออก: ${tOut}`; }
      }
      if (isGuard && isSingleScan) { recordType = 'present'; subType = 'evening_shift'; remark = `เข้างานช่วงเย็น [เวลา: ${tIn}]`; }
      const payloadLog = { machine_id: 'GitHubPages_Login', face_scan_id: userObj.face_scan_id, scan_date: scanDate, scan_time: scanTime, original_log: `Live Match (${scanAction})`, status: 'processed' };
      const payloadDaily = { user_id: userObj.id, attendance_date: scanDate, time_in: timeIn, time_out: timeOut, record_type: recordType, sub_type: subType, remark: remark };
      const urlDaily = dailyData ? `${SUPABASE_URL}/rest/v1/daily_attendance_records?id=eq.${dailyData.id}` : `${SUPABASE_URL}/rest/v1/daily_attendance_records`;
      await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/raw_attendance_logs`, { method: 'POST', headers, body: JSON.stringify(payloadLog) }),
        fetch(urlDaily, { method: dailyData ? 'PATCH' : 'POST', headers, body: JSON.stringify(payloadDaily) })
      ]);
      // success sheet → redirect
      setStep(3);
      openSheet('ลงเวลาสำเร็จ', `
        <div class="text-center py-2">
          <div class="w-20 h-20 mx-auto bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mb-4 pop"><i data-lucide="check" class="w-10 h-10 text-emerald-400"></i></div>
          <p class="font-black text-lg">${userObj.name}</p>
          <p class="text-slate-300 text-sm mt-1">${remark}</p>
          <button onclick="redirectWithResult('${userObj.id}','${userObj.name.replace(/'/g, "\\'")}')" class="w-full mt-6 py-3.5 bg-emerald-600 rounded-2xl font-bold active:scale-95">เสร็จสิ้น</button>
        </div>`);
      document.getElementById('sheet-backdrop').onclick = null;
      setTimeout(() => redirectWithResult(userObj.id, userObj.name), 2500);
    } catch (e) { console.error(e); Toast.fire({ icon: 'error', title: 'บันทึกข้อมูลล้มเหลว' }); setTimeout(backToApp, 1800); }
  }

  async function init() {
    if (window.lucide) lucide.createIcons();
    setStep(0);
    await loadFaceScanConfig();
    if (!IS_TESTING && !isMobileOrTablet()) {
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-block').classList.remove('hidden'); document.getElementById('screen-block').classList.add('flex');
      return;
    }
    // preload models
    try {
      if (!window.faceapi.nets.ssdMobilenetv1.isLoaded) {
        const M = 'https:' + '//cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        await Promise.all([faceapi.nets.ssdMobilenetv1.loadFromUri(M), faceapi.nets.faceLandmark68Net.loadFromUri(M), faceapi.nets.faceRecognitionNet.loadFromUri(M)]);
      }
    } catch (e) { console.warn(e); }
    const b = document.getElementById('btn-start');
    b.disabled = false; b.innerHTML = '<i data-lucide="camera" class="w-5 h-5"></i> <span>เริ่มสแกน</span>';
    if (window.lucide) lucide.createIcons();
  }
  window.addEventListener('load', init);
</script>
</body>
